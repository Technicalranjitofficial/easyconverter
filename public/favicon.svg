<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#e0e7ff" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="32" height="32" rx="7" ry="7" fill="url(#bg)"/>

  <!-- Left document / file shape -->
  <rect x="5" y="8" width="10" height="13" rx="1.5" fill="white" opacity="0.22"/>
  <rect x="6.5" y="10" width="5" height="1.2" rx="0.6" fill="white" opacity="0.55"/>
  <rect x="6.5" y="12.5" width="7" height="1.2" rx="0.6" fill="white" opacity="0.55"/>
  <rect x="6.5" y="15" width="4" height="1.2" rx="0.6" fill="white" opacity="0.55"/>

  <!-- Right document -->
  <rect x="17" y="11" width="10" height="13" rx="1.5" fill="white" opacity="0.22"/>
  <rect x="18.5" y="13" width="5" height="1.2" rx="0.6" fill="white" opacity="0.55"/>
  <rect x="18.5" y="15.5" width="7" height="1.2" rx="0.6" fill="white" opacity="0.55"/>
  <rect x="18.5" y="18" width="4" height="1.2" rx="0.6" fill="white" opacity="0.55"/>

  <!-- Conversion arrow (right-pointing, center) -->
  <g transform="translate(13.5, 14.5)">
    <!-- Shaft -->
    <rect x="0" y="1.2" width="5" height="2" rx="1" fill="url(#arrow)"/>
    <!-- Arrowhead -->
    <polygon points="4.5,0 8,2.2 4.5,4.4" fill="url(#arrow)"/>
  </g>

  <!-- Small lightning bolt in top-right corner — speed/instant feel -->
  <polygon points="24,5 21.5,10 23.5,10 21,15 26,8.5 23.5,8.5" fill="#fbbf24" opacity="0.95"/>
</svg>
